<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --abyss:#05070d;
    --ink:#e9eef5;
    --dim:#5c6a7e;
    --pill:rgba(14,20,32,.72);
    --pill-brd:rgba(150,180,220,.14);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--abyss)}
  #app{
    /* Pinned top-left and sized in JS to the VISIBLE frame (window.screen), not the raw window — on scaled/HiDPI
       fullscreen the window can be larger than the screen, so we anchor the stage to what's actually on-screen. */
    position:fixed;top:0;left:0;width:100%;height:100%;background:var(--abyss);
    overflow:hidden;cursor:default;
    -webkit-user-select:none;user-select:none;
    font-family:var(--mono);color:var(--ink);
  }
  #app.hide-cursor{cursor:none}
  #c{position:absolute;inset:0;display:block}

  /* Block-arrival whisper — an event, not a readout */
  #announce{
    position:absolute;left:0;right:0;bottom:14%;
    text-align:center;pointer-events:none;
    opacity:0;transition:opacity 1.1s ease;
  }
  #announce.show{opacity:1}
  #announce .h{
    font-size:clamp(13px,1.7vw,17px);letter-spacing:.42em;
    text-indent:.42em;font-weight:500;color:#f3ead2;
    text-shadow:0 0 22px rgba(246,231,184,.35);
  }
  #announce .hash{
    margin-top:.7em;font-size:clamp(9px,1vw,11px);
    letter-spacing:.24em;text-indent:.24em;color:var(--dim);
  }

  /* Optional persistent telemetry — off by default, for the curious */
  #tele{
    position:absolute;top:20px;left:22px;
    font-size:11px;line-height:1.85;letter-spacing:.06em;
    color:var(--dim);opacity:0;transition:opacity .5s ease;
    pointer-events:none;
  }
  #tele.on{opacity:1}
  #tele b{color:#aab6c8;font-weight:500}
  #tele .warm{color:#e9a24c}

  /* Controls — auto-hiding pill */
  #controls{
    position:absolute;left:50%;bottom:26px;transform:translate(-50%,14px);
    display:flex;align-items:center;gap:6px;
    padding:6px;border-radius:999px;
    background:var(--pill);border:1px solid var(--pill-brd);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;
  }
  #app.show-ui #controls{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .seg{display:flex;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.04)}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    padding:8px 14px;cursor:pointer;transition:color .2s,background .2s;
  }
  .seg button:hover{color:#c4cedb}
  .seg button[aria-pressed="true"]{color:#0a0d14;background:#dfe6ef}
  .icon{
    appearance:none;border:0;background:rgba(255,255,255,.04);color:var(--dim);
    width:34px;height:34px;border-radius:999px;cursor:pointer;
    display:grid;place-items:center;transition:color .2s,background .2s;
  }
  .icon:hover{color:#c4cedb;background:rgba(255,255,255,.08)}
  .icon[aria-pressed="true"]{color:#f0c05a;background:rgba(240,192,90,.12)}
  .icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .divider{width:1px;height:20px;background:var(--pill-brd);margin:0 2px}

  #hint{
    position:absolute;left:50%;bottom:74px;transform:translateX(-50%);
    font-size:10.5px;letter-spacing:.16em;color:#3f4a5c;text-align:center;
    opacity:0;transition:opacity .6s ease;pointer-events:none;white-space:nowrap;
  }
  #app.show-ui #hint.live{opacity:1}

  :focus-visible{outline:2px solid #6fb7d6;outline-offset:3px;border-radius:999px}
  @media (max-width:520px){
    .seg button{padding:8px 10px}
    #hint{white-space:normal;width:80%}
  }
</style>

<div id="app" class="show-ui">
  <canvas id="c"></canvas>

  <div id="announce" aria-hidden="true">
    <div class="h" id="an-h">BLOCK</div>
    <div class="hash" id="an-hash"></div>
  </div>

  <div id="status" style="position:absolute;left:0;right:0;top:26px;text-align:center;font-size:12px;letter-spacing:.28em;text-indent:.28em;color:#5c6a7e;opacity:0;transition:opacity .7s ease;pointer-events:none"></div>

  <div id="hint" class="live">PRESS ESC TO EXIT</div>
  <div id="dbg" style="position:absolute;left:12px;bottom:12px;font:12px ui-monospace,monospace;color:#4fd08a;opacity:0;z-index:99;pointer-events:none;text-shadow:0 0 6px #000"></div>
</div>

<script>
(() => {
  "use strict";
  const app = document.getElementById('app');
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DEBUG = new URLSearchParams(location.search).has('debug'); // ?debug=1 → show a size readout for diagnosing off-screen issues
  const dbg = document.getElementById('dbg');

  // ---- master tunables ----
  const EXPOSURE = 0.86;                    // one knob for overall brightness (raised for dim/f.lux screens)
  const A = a => a * EXPOSURE;
  const SCENE = 0.86;                        // shrink the whole composition a touch so it sits comfortably inside the safe area
  const SAFE  = 0.93;                        // action-safe: the sphere/attempt stay within this fraction of the visible frame (analog-TV "action safe")

  // ---- geometry ----
  // W,H are the VISIBLE frame — not necessarily the whole window. On scaled/HiDPI fullscreen the OS can hand us a
  // canvas larger than the screen (it spills off the bottom-right); window.screen reports the real visible size, so
  // we clamp to it and pin the stage there. `base` is the scale unit everything keys off, shrunk by SCENE.
  let W=0,H=0,cx=0,cy=0,base=0,dpr=1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    const sw = (window.screen && window.screen.width)  || window.innerWidth;
    const sh = (window.screen && window.screen.height) || window.innerHeight;
    W = Math.min(window.innerWidth,  sw);   // visible width  (canvas CSS units — action-safe against overscan)
    H = Math.min(window.innerHeight, sh);   // visible height
    app.style.width = W+'px'; app.style.height = H+'px'; // pin the stage to the visible frame, top-left anchored
    c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W/2; cy = H/2; base = Math.min(W,H) * SCENE;
    if(DEBUG && dbg){ dbg.style.opacity='1'; dbg.textContent = `win ${window.innerWidth}×${window.innerHeight} → stage ${W}×${H}  dpr ${window.devicePixelRatio}(→${dpr})  ·  screen ${sw}×${sh}  avail ${screen.availWidth}×${screen.availHeight}`; }
  }
  window.addEventListener('resize', resize); resize();
  [90, 300, 700, 1400].forEach(d => setTimeout(resize, d)); // re-measure after the window settles into fullscreen (per-platform / DPI timing)

  // the sphere wanders a central band — pure sines sweep evenly (no side bias); centred a touch high
  // so the coin's downward sink passes through the middle rather than always sitting low
  function sphereCenter(t){
    const dx=Math.sin(t*0.00011);
    const dy=Math.sin(t*0.00019 + 2.1);
    return [ (W/2) + dx*base*0.27, (H*0.44) + dy*base*0.15 ];
  }

  // ---- color helpers ----
  const ABYSS = [5,7,13];
  const TEMP = [               // heating curve: cold cyan -> ember
    [0.00,[ 58,160,200]],
    [0.35,[121,201,192]],
    [0.60,[233,196,106]],
    [0.82,[244,129, 63]],
    [1.00,[255, 83, 48]],
  ];
  function temp(p){
    p = Math.max(0,Math.min(1,p));
    for(let i=1;i<TEMP.length;i++){
      if(p<=TEMP[i][0]){
        const a=TEMP[i-1], b=TEMP[i];
        const t=(p-a[0])/(b[0]-a[0]);
        return [ a[1][0]+(b[1][0]-a[1][0])*t,
                 a[1][1]+(b[1][1]-a[1][1])*t,
                 a[1][2]+(b[1][2]-a[1][2])*t ];
      }
    }
    return TEMP[TEMP.length-1][1].slice();
  }
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
  function hsl(h,s,l){
    s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);
    const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
    return [255*f(0),255*f(8),255*f(4)];
  }

  // ---- glow sprites: the swarm makes the light — dense overlap sums to brightness ----
  function makeSprite(rgb, a){
    const S=96, oc=document.createElement('canvas'); oc.width=oc.height=S;
    const o=oc.getContext('2d');
    const g=o.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    g.addColorStop(0, rgba(rgb, a));
    g.addColorStop(0.4, rgba(rgb, a*0.32));
    g.addColorStop(1, rgba(rgb, 0));
    o.fillStyle=g; o.fillRect(0,0,S,S);
    return oc;
  }
  const SP_COOL = makeSprite([150,205,230], 0.74);   // the cool sea (lifted so f.lux doesn't kill it)
  const SP_WARM = makeSprite([255,210,140], 0.76);   // a warming transaction
  const SP_HOT  = makeSprite([255,130, 80], 0.78);   // near-mine ember
  let   SP_COIN = makeSprite([255,242,224], 0.82);   // regenerated per block from its hash hue
  const SP_ATTEMPT = makeSprite([150,165,210], 0.55); // cold periwinkle — "yours"; never caught fire, distinct from the warm gathering
  function stamp(sprite,x,y,r,a){
    if(a<=0.002) return;
    ctx.globalAlpha=a;
    ctx.drawImage(sprite, x-r, y-r, r*2, r*2);
  }

  // ---- state ----
  const state = {
    landedAt: -1e9,
    height: 0,
    hashHex: '',
    bloom: null,
    sinkDone: true,
    coinCx: 0, coinCy: 0,
    best: {zeros:-1, star:null, hex:''},
    shimmer: Math.PI*0.3,
  };

  // ---- live feed from the user's own node (/node.json) ----
  const node = { reachable:false, synced:false, height:0, tipTime:0, mempoolCount:0, syncPct:1 };
  let nodeMode = false, feedFails = 0, lastHeight = 0;      // nodeMode=false → no server (e.g. opened as a file) → preview cadence
  let simHeight = 958000, simTipMs = 0;                    // preview fallback only

  // 32 deterministic bytes from a 32-bit seed — every node showing the same block shows the same coin.
  function seedBytes(n){
    let s = ((n>>>0) ^ 0x9e3779b9) >>> 0; const b = new Uint8Array(32);
    for(let i=0;i<32;i++){ s ^= s<<13; s ^= s>>>17; s ^= s<<5; s>>>=0; b[i] = s & 0xff; }
    return b;
  }
  // seed from the REAL block hash (fold the whole string — block hashes have leading zeros),
  // falling back to the height when the node hasn't published a hash.
  function foldHex(h){ let s=0x811c9dc5>>>0; for(let i=0;i<h.length;i++){ s^=h.charCodeAt(i); s=Math.imul(s,0x01000193)>>>0; } return s>>>0; }
  function blockSeed(height, hashHex){ return (hashHex && hashHex.length>=16) ? foldHex(hashHex) : (height>>>0); }
  // ---- your best-ever near-miss: a weak second sphere that can't gather a full block ----
  // gravity ∝ leading-zero-bits — it pulls only a small, loose clutch of transactions and never locks.
  const attempt = { bits:0, ang:0, rad:0.32, bob:0, P:[] };
  function mkOrbit(){
    let wx=Math.random()*2-1, wy=Math.random()*2-1, wz=Math.random()*2-1;
    const wl=Math.hypot(wx,wy,wz)||1; wx/=wl; wy/=wl; wz/=wl;
    let ax=0,ayv=1,az=0; if(Math.abs(wy)>0.9){ax=1;ayv=0;}
    let ux=wy*az-wz*ayv, uy=wz*ax-wx*az, uz=wx*ayv-wy*ax;
    const ul=Math.hypot(ux,uy,uz)||1; ux/=ul; uy/=ul; uz/=ul;
    return { ux,uy,uz, vx:wy*uz-wz*uy, vy:wz*ux-wx*uz, vz:wx*uy-wy*ux,
             oa:Math.random()*6.283, os:(0.0005+Math.random()*0.0007)*(Math.random()<.5?-1:1), size:0.5+Math.random()*1.0 };
  }
  function seedAttempt(bits, hash){
    attempt.bits = bits;
    const s = foldHex(hash || ('b'+bits));
    attempt.ang = 2.0 + (s%140)/140*2.4;   // radians ~[2.0,4.4] → the left side: a consistently dark home, even at peak warmth
    attempt.rad = 0.36 + ((s>>>9)%80)/80*0.08;                    // its own home, out toward the periphery (clear of the main sphere)
    attempt.bob = ((s>>>16)%628)/100;
    const count = Math.max(2, Math.min(40, Math.round(bits*0.8))); // a few tx at 11 bits; more as you improve, never a full block
    attempt.P = Array.from({length:count}, mkOrbit);
  }
  function leadingZeroBits(b){
    let z=0;
    for(let i=0;i<b.length;i++){
      if(b[i]===0){z+=8;continue;}
      let v=b[i],c=0;while((v&0x80)===0){c++;v<<=1;} z+=c;break;
    }
    return z;
  }
  const hex=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');

  function landBlock(t, height, hashHex){
    const real = hashHex && hashHex.length >= 16;
    const b = seedBytes(blockSeed(height, hashHex));
    const zeros = leadingZeroBits(b);
    state.height = height;
    state.landedAt = t;
    state.hashHex = real ? hashHex : hex(b);
    state.bloom = {
      hue:   b[0]/255*360,
      sym:   5 + (b[1]%5),                 // 5..9-fold
      rings: 1 + (b[2]%2),                 // 1..2 concentric orders
      dir:   (b[3]&1)?1:-1,
      wob:   0.14 + b[4]/255*0.22,         // petal bulge
      depth: 2 + (b[5]%2),                 // fractal recursion 2..3
      branch:0.36 + b[6]/255*0.46,         // fractal branch angle (rad)
      ratio: 0.58 + b[7]/255*0.16,         // fractal length falloff
      zeros,
      hex: state.hashHex,
    };
    // (the gold star is YOUR best-ever near-miss, set from the node feed — not this winning block)
    state.sinkDone = false;                  // this block will condense into a coin, then sink
    { const sc=sphereCenter(t); state.coinCx=sc[0]; state.coinCy=sc[1]; }   // lock the coin where the sphere is now
    { const hc=hsl(state.bloom.hue,72,62); SP_COIN = makeSprite(mix(hc,[255,248,235],0.4), 0.82); }
    announce();
  }

  // ---- two layers: the OCEAN (mempool at large) and the RING (block template) ----
  // Ocean particles drift across the whole screen — transactions entering and leaving.
  // As pressure builds, the ring condenses OUT of the ocean (txs selected for the next
  // block); when the block is born the ring solidifies into the bloom and is released.
  const N = reduce ? 460 : 960;
  const P = new Array(N);
  function spawn(i){
    P[i] = {
      x: Math.random()*W, y: Math.random()*H,
      role:'ocean',
      thr: 0.15 + Math.random()*1.15,      // pressure at which this tx joins the sphere
      ringAng: Math.random()*Math.PI*2,
      ringSpin:(Math.random()*0.4+0.2)*(Math.random()<.5?-1:1),
      size:0.6+Math.random()*1.5,
      seed:Math.random(),
      spd:0.6+Math.random()*0.9,
      wobs:0.5+Math.random()*1.2,
      life:Math.random(),
      out:0, ovx:0, ovy:0,
    };
  }
  for(let i=0;i<N;i++) spawn(i);

  function respawnEdge(q){                   // a transaction enters the sea from an edge
    const s=Math.floor(Math.random()*4);
    if(s===0){q.x=-15;q.y=Math.random()*H;}
    else if(s===1){q.x=W+15;q.y=Math.random()*H;}
    else if(s===2){q.y=-15;q.x=Math.random()*W;}
    else{q.y=H+15;q.x=Math.random()*W;}
    q.life=0;
  }
  // (the coin's transactions return to the sea via the one-shot sink handler in render)
  function glow(x,y,r,a,col){
    const g=ctx.createRadialGradient(x,y,0,x,y,r*3.2);
    g.addColorStop(0, rgba(col,a));
    g.addColorStop(1, rgba(col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*3.2,0,7); ctx.fill();
  }

  // ---- announce ----
  const anEl=document.getElementById('announce');
  const anH=document.getElementById('an-h');
  const anHash=document.getElementById('an-hash');
  let anTimer=0;
  function announce(){
    anH.textContent = 'BLOCK ' + state.height.toLocaleString('en-US');
    const h=state.hashHex;
    anHash.textContent = h.slice(0,8)+' … '+h.slice(-8);
    anEl.classList.add('show');
    clearTimeout(anTimer);
    anTimer=setTimeout(()=>anEl.classList.remove('show'), 3200);
  }

  // ---- node feed: poll /node.json, drive real block events + real warmth ----
  const statusEl=document.getElementById('status');
  function setStatus(txt){ statusEl.textContent = txt || ''; statusEl.style.opacity = txt ? '1' : '0'; }

  function onNewBlock(height, hashHex){
    if(height === state.height) return;   // never solidify the same block twice (real & preview heights are always distinct)
    landBlock(performance.now(), height, hashHex);
  }

  let polling = false;                                         // serialize polls: a slow fetch must not let two polls overlap
  async function pollNode(){
    if(polling) return;                                        // …or both would see the same new height and land the block twice
    polling = true;
    try {
      const j = await (await fetch('/node.json', { cache:'no-store' })).json();
      nodeMode = true; feedFails = 0;
      node.reachable = !!j.reachable;
      node.height = j.blocks || j.height || 0;          // the bridge writes the tip height as `blocks`
      node.tipTime = j.tip_time || 0;
      node.mempoolCount = (j.mempool && j.mempool.count) || 0;
      node.syncPct = j.verificationprogress != null ? j.verificationprogress : 1;
      node.synced = node.reachable && !j.initialblockdownload && node.syncPct > 0.9999;
      if(!node.reachable) setStatus('CONNECTING TO YOUR NODE…');
      else if(!node.synced) setStatus('SYNCING · ' + Math.floor(node.syncPct*100) + '%');
      else setStatus('');
      // your best-ever near-miss (most leading-zero-bits, persisted across sessions) drives the weak second sphere
      const mb = j.miner && j.miner.best;
      if(mb && typeof mb.zero_bits === 'number' && mb.zero_bits > state.best.zeros){
        state.best.zeros = mb.zero_bits;
        state.best.hex = mb.hash || '';
        seedAttempt(mb.zero_bits, mb.hash || '');
      }
      if(node.synced){
        if(lastHeight && node.height > lastHeight) onNewBlock(node.height, j.bestblockhash);   // a real block arrived
        lastHeight = node.height;
      }
    } catch(_){
      if(++feedFails > 2){ nodeMode = false; setStatus(''); }   // no server (opened as a file) → preview cadence
    } finally {
      polling = false;
    }
  }

  // warmth p: real time since the last block toward ~10 min; calm while syncing; a gentle cadence only off-server
  const EXPECTED_S = 600;
  function pressure(){
    if(nodeMode){
      if(!node.synced || !node.tipTime) return 0.02;                 // connecting/syncing → a calm sea, no blocks
      return clamp((Date.now()/1000 - node.tipTime) / EXPECTED_S);
    }
    if(feedFails <= 2) return 0.02;                                  // still probing for the node → never fake a block in the app
    if(!simTipMs) simTipMs = Date.now();                            // confirmed no server → ~20s preview cadence
    const el = (Date.now() - simTipMs)/1000;
    if(el >= 20){ simTipMs = Date.now(); onNewBlock(++simHeight); return 0; }
    return clamp(el/20);
  }

  if(location.protocol !== 'file:'){ pollNode(); setInterval(pollNode, 4000); } // served → live node feed
  else feedFails = 99;                                                           // .saver / file:// → self-contained cadence, no fetch

  // ---- fractal petal (recursive frond) ----
  function petal(ox,oy,len,ang,depth,wob,alpha,bh,bhl){
    if(depth<0 || len<7) return;
    const c=Math.cos(ang), s=Math.sin(ang);
    const tx=ox+c*len, ty=oy+s*len;
    const mx=ox+c*len*0.5, my=oy+s*len*0.5;
    const px=Math.cos(ang+1.5708)*len*wob, py=Math.sin(ang+1.5708)*len*wob;
    const grd=ctx.createLinearGradient(ox,oy,tx,ty);
    grd.addColorStop(0, rgba(bhl, A(alpha)));
    grd.addColorStop(1, rgba(bh, 0));
    ctx.strokeStyle=grd;
    ctx.lineWidth=Math.max(0.4, len*0.012);
    ctx.beginPath();
    ctx.moveTo(ox,oy);
    ctx.quadraticCurveTo(mx+px, my+py, tx, ty);
    ctx.quadraticCurveTo(mx-px, my-py, ox, oy);
    ctx.stroke();
    const tg=ctx.createRadialGradient(tx,ty,0,tx,ty,len*0.13);
    tg.addColorStop(0, rgba(bhl, A(alpha*0.7)));
    tg.addColorStop(1, rgba(bhl,0));
    ctx.fillStyle=tg; ctx.beginPath(); ctx.arc(tx,ty,len*0.13,0,7); ctx.fill();
    const B=state.bloom;
    petal(tx,ty, len*B.ratio, ang+B.branch, depth-1, wob*0.92, alpha*0.72, bh,bhl);
    petal(tx,ty, len*B.ratio, ang-B.branch, depth-1, wob*0.92, alpha*0.72, bh,bhl);
  }

  // ---- render ----
  let last=performance.now();
  function frame(t){
    const dt = Math.min(50, t-last); last=t;
    requestAnimationFrame(frame);

    let p = clamp(pressure());   // real warmth from the node feed: time since the last block toward ~10 min

    // block lifecycle: the gathered swarm LOCKS into a coin, whose weight sinks it into the deep
    const bloomAge = t - state.landedAt;
    // block lands → CONVERGE (whole swarm rushes in and gathers) → CONDENSE (locks into the coin) → SINK.
    // The converge phase guarantees you always SEE the swarm form the sphere, never a coin popping from nothing.
    const CONVERGE_MS = reduce?700:900, CONDENSE_MS = reduce?1000:780, SINK_MS = reduce?1700:1500;
    const active = bloomAge < CONVERGE_MS+CONDENSE_MS+SINK_MS; // a block is being formed (any of the three phases)
    const converging = active && bloomAge < CONVERGE_MS;      // swarm rushing inward — gathered but NOT yet locked
    const mined = active && bloomAge >= CONVERGE_MS;          // locked into the coin, then sinking
    const cp = clamp((bloomAge-CONVERGE_MS)/CONDENSE_MS);     // 0..1 locking into one solid mass (after the converge)
    const sp = clamp((bloomAge-CONVERGE_MS-CONDENSE_MS)/SINK_MS); // 0..1 sinking away
    const sinkY = mined ? base*0.34*(sp*sp) : 0;             // weight sinks it — but ONLY once locked
    // once the coin has sunk, fresh transactions surface from the sea (one-shot)
    if(!active && !state.sinkDone && state.landedAt>0){
      for(let i=0;i<N;i++){ const q=P[i];
        if(q.role==='sphere'){                 // the coin's txs return to the sea — already lit, no fade-in
          q.role='ocean'; q.life=1;
          q.x=Math.random()*W; q.y=cy + base*0.28 + Math.random()*base*0.6;   // rise from the deep below
        }
        q.thr=0.15+Math.random()*1.15;     // reshuffle the WHOLE sea's thresholds — nothing gets retired
      }
      state.sinkDone=true;
    }

    const col = temp(p);

    // where the sphere is right now: drifting while it gathers, frozen where it locked when mined
    let scx, scy;
    if(active){ scx=state.coinCx; scy=state.coinCy; }   // freeze the gather point from the moment the block lands, through the sink
    else { const sc=sphereCenter(t); scx=sc[0]; scy=sc[1]; }
    // action-safe: keep the whole gathered sphere (centre ± its radius) inside SAFE% of the visible frame, any aspect.
    // (The downward sink is added later at draw time, so the coin can still slip below as it fades into the deep.)
    const smx = W*(1-SAFE)/2 + base*0.20, smy = H*(1-SAFE)/2 + base*0.20;
    scx = Math.max(smx, Math.min(W-smx, scx)); scy = Math.max(smy, Math.min(H-smy, scy));

    // --- trail fade (warmed slightly by pressure) ---
    ctx.globalCompositeOperation='source-over';
    const fade = mix(ABYSS, col, 0.04*p);
    ctx.fillStyle = rgba(fade, reduce?0.5:0.42);   // clears faster → short tails, not long traces
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation='lighter';

    // --- ambient temperature glow (dim, soft-edged; centred on the drifting sphere) ---
    const amb = base*(0.9 + 0.06*Math.sin(t/3000));
    const aw = A(0.05 + 0.03*p);
    let g = ctx.createRadialGradient(scx,scy,0,scx,scy,amb);
    g.addColorStop(0.0, rgba(col, aw));
    g.addColorStop(0.35, rgba(col, aw*0.5));
    g.addColorStop(0.65, rgba(col, aw*0.16));
    g.addColorStop(1.0, rgba(col, 0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(scx,scy,amb,0,7); ctx.fill(); // arc centre now matches the gradient (was cx,cy → hard edge)

    // (your best-ever near-miss is drawn as the weak second sphere below, after the main swarm)

    // --- the gathering sphere: each tx rides its OWN orbit, so directions criss-cross ---
    const AX=0.42, cAX=Math.cos(AX), sAX=Math.sin(AX);
    const gatherR = base*0.17;
    let sphereR = gatherR;
    if(mined){ sphereR = gatherR*(1-cp) + (base*0.072)*cp; sphereR *= (1 - 0.85*sp); }  // packs tighter
    const hashCol = state.bloom ? hsl(state.bloom.hue,70,60) : [255,255,255];

    // --- ONE swarm: the whole field warms together; the sphere is just where it's gathered ---
    const drift = reduce?0.4:1;
    const swarmSprite = p<0.4 ? SP_COOL : (p<0.75 ? SP_WARM : SP_HOT);
    const oceanF = 0.55 + 0.45*clamp(node.mempoolCount/60000);   // the sea is your mempool — fuller when it's busy
    const RES = base/1100;   // scale sprite sizes with the display so their apparent size is resolution-independent (not oversized on low-res)
    for(let i=0;i<N;i++){
      const q=P[i];

      // pressure lifts a transaction from the sea onto its own great-circle orbit;
      // when a block lands, `converging` recruits the ENTIRE sea at once so the whole swarm rushes in to form the sphere
      if(q.role==='ocean' && (p>q.thr || converging)){
        q.role='sphere';
        let wx=Math.random()*2-1, wy=Math.random()*2-1, wz=Math.random()*2-1;
        const wl=Math.hypot(wx,wy,wz)||1; wx/=wl; wy/=wl; wz/=wl;   // random orbit axis
        let ax=0,ayv=1,az=0; if(Math.abs(wy)>0.9){ax=1;ayv=0;}
        let ux=wy*az-wz*ayv, uy=wz*ax-wx*az, uz=wx*ayv-wy*ax;
        const ul=Math.hypot(ux,uy,uz)||1; ux/=ul; uy/=ul; uz/=ul;   // u ⟂ axis
        q.ux=ux; q.uy=uy; q.uz=uz;
        q.vx=wy*uz-wz*uy; q.vy=wz*ux-wx*uz; q.vz=wx*uy-wy*ux;        // v = axis × u
        q.oa=Math.random()*6.283;
        q.os=(0.0006+Math.random()*0.0008)*(Math.random()<.5?-1:1);
      }

      if(q.role==='sphere'){
        if(!mined) q.oa += q.os*dt*(1+0.8*p)*drift;      // orbits while gathering; LOCKS when mined
        const ca=Math.cos(q.oa), sa=Math.sin(q.oa);
        const X=q.ux*ca+q.vx*sa, Y=q.uy*ca+q.vy*sa, Z=q.uz*ca+q.vz*sa;
        const y1=Y*cAX - Z*sAX;
        const zN=Y*sAX + Z*cAX;                          // -1 far .. +1 near
        const persp=1/(1 - zN*0.38);                     // perspective: near spreads wider & larger
        const tx=scx + X*sphereR*persp;
        const ty=scy + y1*sphereR*persp + sinkY;
        const settleK = mined?0.16:(converging?0.06:0.028); // slow drift while gathering · brisk rush-in during converge · snap on lock
        q.x+=(tx-q.x)*settleK*drift; q.y+=(ty-q.y)*settleK*drift;
        const depth=0.4+0.6*(zN*0.5+0.5);
        const pr=q.size*6.5*RES*(0.8+0.5*depth)*persp*(mined?1+0.7*cp:1);   // glows grow as they lock → overlap fills gaps
        if(mined){
          stamp(SP_COIN, q.x,q.y, pr, A((0.14+0.40*cp)*depth*(1-0.9*sp)));  // packs into a gapless solid coin
        } else {
          stamp(swarmSprite, q.x,q.y, pr, A(0.15*depth));                   // same sprite as the sea
        }
      } else {
        // ocean drift — an edgeless deep: wrap with no walls, fade into the dark at the borders
        const fx=Math.sin(q.y*0.0016 + t*0.00012)+Math.cos((q.x*0.9+q.y)*0.0012 - t*0.00008);
        const ang=fx*1.7 + q.seed*6.283;
        q.x+=Math.cos(ang)*0.02*dt*drift*q.spd;
        q.y+=Math.sin(ang)*0.02*dt*drift*q.spd;
        if(q.x<-30)q.x=W+30; else if(q.x>W+30)q.x=-30;
        if(q.y<-30)q.y=H+30; else if(q.y>H+30)q.y=-30;
        if(q.life<1) q.life=Math.min(1,q.life+dt*0.0009);
        const ex=Math.min(1, q.x/(W*0.12), (W-q.x)/(W*0.12));
        const ey=Math.min(1, q.y/(H*0.12), (H-q.y)/(H*0.12));   // no surface line at the top
        const edge=Math.max(0, Math.min(ex,ey));
        stamp(swarmSprite, q.x,q.y, q.size*6.5*RES, A(0.15*q.life*edge*oceanF));   // same swarm as the sphere; density tracks the mempool
      }
    }
    ctx.globalAlpha=1;

    // --- your best-ever near-miss: a weak, dim sphere that pulls a few tx but never gathers a full block ---
    if(attempt.P.length){
      const r = attempt.rad*base;
      const AR = base*0.075;
      const mx = W*(1-SAFE)/2 + base*0.14, my = H*(1-SAFE)/2 + base*0.14; // action-safe: keep the clump inside the visible frame, any aspect
      let ax = cx + Math.cos(attempt.ang)*r*1.6 + Math.sin(t*0.00012+attempt.bob)*base*0.02; // reach the dark side thirds on wide screens
      let ay = cy + Math.sin(attempt.ang)*r*0.85 + Math.cos(t*0.00009+attempt.bob)*base*0.02;
      ax = Math.max(mx, Math.min(W - mx, ax));   // clamp so a narrow/laptop aspect can't push it off-screen
      ay = Math.max(my, Math.min(H - my, ay));
      for(const q of attempt.P){
        q.oa += q.os*dt*0.7;
        const ca=Math.cos(q.oa), sa=Math.sin(q.oa);
        const X=q.ux*ca+q.vx*sa, Y=q.uy*ca+q.vy*sa, Z=q.uz*ca+q.vz*sa;
        const y1=Y*cAX - Z*sAX, zN=Y*sAX + Z*cAX;
        const persp=1/(1 - zN*0.35);
        const loose = 1 + 0.12*Math.sin(t*0.001 + q.oa*2);   // slightly loose — it can't quite hold, but reads as a clump
        const x = ax + X*AR*persp*loose;
        const y = ay + y1*AR*persp*loose;
        const depth = 0.4 + 0.6*(zN*0.5+0.5);
        stamp(SP_ATTEMPT, x, y, q.size*5.5*persp*RES, A(0.30*depth));  // yours: a small coherent clump in its own dark corner
      }
      ctx.globalAlpha=1;
    }

    if(DEBUG){ // sizing check: MAGENTA cross = where the sphere centres · GREEN dots = the four canvas corners
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#ff2bd6';
      ctx.beginPath(); ctx.arc(cx,cy,9,0,7); ctx.fill();
      ctx.strokeStyle='#ff2bd6'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx-34,cy); ctx.lineTo(cx+34,cy); ctx.moveTo(cx,cy-34); ctx.lineTo(cx,cy+34); ctx.stroke();
      ctx.fillStyle='#22ff88';
      for(const m of [[22,22],[W-22,22],[22,H-22],[W-22,H-22]]){ ctx.beginPath(); ctx.arc(m[0],m[1],9,0,7); ctx.fill(); }
    }

    // (the coin is formed entirely by the packed swarm above — no drawn sphere body)
  }
  requestAnimationFrame(frame);

  // ---- exit hint: "Press Esc to exit" shows on activity, fades when idle ----
  let uiTimer=0;
  function poke(){
    app.classList.add('show-ui'); app.classList.remove('hide-cursor');
    clearTimeout(uiTimer);
    uiTimer=setTimeout(()=>{ app.classList.remove('show-ui'); app.classList.add('hide-cursor'); }, 3000);
  }
  ['mousemove','pointerdown','keydown','touchstart'].forEach(ev =>
    window.addEventListener(ev, poke, {passive:true}));
  poke();

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){ last=performance.now(); }
  });
})();
</script>
