# Cross-platform release — build + publish notzero to R2 (dl.getnotzero.com) for mac, Windows, and Linux.
#
# TWO WAYS TO RUN:
#   1. REAL RELEASE — push a version tag matching desktop/package.json:
#        git tag v0.1.18 && git push origin v0.1.18
#      A deliberate tag (not every push) so a stray commit never auto-ships to all users.
#   2. DRY RUN — Actions tab → "Release" → "Run workflow" (dry_run = true, the default):
#      builds each platform's installer with signing/publish DISABLED — no secrets needed, nothing uploaded.
#      Use it to confirm the build pipeline before trusting it with a real tag.
#
# Each real-release platform runs its existing release-*.sh / .ps1 script (build engines → electron-builder →
# sign/notarize → rclone to R2). The node-gated block-validity check is skipped in CI (SKIP_BLOCK_VERIFY=1) —
# block validity is platform-independent, so verify it ONCE locally (`python3 scripts/verify-block.py` against
# your synced node) before tagging, rather than 3× on runners with no node.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions) — only needed for a REAL release:
#   R2_ACCESS_KEY_ID         Cloudflare R2 access key id
#   R2_SECRET_ACCESS_KEY     Cloudflare R2 secret
#   R2_ENDPOINT              https://<account>.r2.cloudflarestorage.com
#   APPLE_API_KEY_P8_BASE64  base64 of the App Store Connect .p8 key  (base64 -i AuthKey_XXXX.p8)
#   APPLE_API_KEY_ID         the .p8 key id
#   APPLE_API_ISSUER         App Store Connect issuer uuid
#   MAC_CERT_P12_BASE64      base64 of the "Developer ID Application" cert exported as .p12
#   MAC_CERT_PASSWORD        the .p12 export password
#   MAC_SIGN_ID (optional)   overrides the default "Developer ID Application: Stephen Zinn (2386YZLWA2)"

name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — skip signing, notarizing, and the R2 upload (no secrets needed)."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the pinned Bitcoin Core hashes must match Core's PGP-signed SHA256SUMS before we build/ship anything.
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify pinned Bitcoin Core hashes against the PGP-signed SHA256SUMS
        run: node scripts/verify-core-pins.cjs

  release:
    needs: verify-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: mac }
          - { os: windows-latest, platform: win }
          - { os: ubuntu-latest, platform: linux }
    runs-on: ${{ matrix.os }}
    env:
      IS_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      SKIP_BLOCK_VERIFY: "1" # CI has no synced node; block validity is platform-independent (verify once locally)
      R2_BUCKET: "r2:notzero-dl"
      # configure rclone's `r2` remote entirely from env (no config file needed)
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACL: private
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller + certifi
        # certifi is REQUIRED: lottery_miner.py imports it for the HTTPS trust store, and PyInstaller only
        # bundles cacert.pem if certifi is installed in the build env. Without it the miner can't verify SSL.
        run: python -m pip install --upgrade pip pyinstaller certifi psutil

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          V="$(node -p "require('./desktop/package.json').version")"
          T="${GITHUB_REF_NAME#v}"
          echo "tag=$T package.json=$V"
          [ "$V" = "$T" ] || { echo "::error::tag v$T does not match desktop/package.json $V — bump package.json first"; exit 1; }

      - name: Linux AppImage deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb  # xvfb: virtual display for the launch smoke test

      - name: npm ci
        working-directory: desktop
        run: npm ci

      # rclone + Apple secrets are only needed for a REAL release (dry run skips upload + signing).
      - name: Install rclone (unix)
        if: env.IS_DRY != 'true' && runner.os != 'Windows'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Install rclone (windows)
        if: env.IS_DRY != 'true' && runner.os == 'Windows'
        run: choco install rclone -y

      - name: Import Apple signing cert
        if: env.IS_DRY != 'true' && matrix.platform == 'mac'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Write Apple API key
        if: env.IS_DRY != 'true' && matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Each platform runs its own release script. DRY_RUN=1 (dry run) builds but skips signing + upload —
      # using the CORRECT per-platform engine build (Win/Linux build inline; only mac uses universal2).
      - name: Release macOS
        if: matrix.platform == 'mac'
        env:
          DRY_RUN: ${{ env.IS_DRY == 'true' && '1' || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_SIGN_ID: ${{ secrets.MAC_SIGN_ID }}
          LOTTERY_DATA_DIR: ${{ runner.temp }} # release-mac.sh requires it set; unused (gate skipped)
        run: bash scripts/release-mac.sh

      - name: Release Linux
        if: matrix.platform == 'linux'
        env:
          DRY_RUN: ${{ env.IS_DRY == 'true' && '1' || '' }}
        run: bash scripts/release-linux.sh

      - name: Release Windows
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          DRY_RUN: ${{ env.IS_DRY == 'true' && '1' || '' }}
        run: |
          # The runner checks out on D: but installs Python on C:; PyInstaller collects the Python runtime
          # (C:) into the build dir and computes a cross-drive relpath, which Windows can't do. Build from a
          # C: copy so sources, Python, temp, and outputs all share one drive. (robocopy: <8 = success.)
          robocopy "$env:GITHUB_WORKSPACE" "C:\notzero" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          & "C:\notzero\scripts\release-win.ps1"

      # Publish the changelog to the CDN once (mac job) so the in-app "what's new" dialogs and the website
      # release-notes page always fetch the version that shipped.
      - name: Publish CHANGELOG to CDN
        if: matrix.platform == 'mac' && env.IS_DRY != 'true'
        shell: bash
        run: |
          rclone copyto CHANGELOG.md "$R2_BUCKET/CHANGELOG.md" --s3-no-check-bucket
          echo "published CHANGELOG.md:"; curl -s "https://dl.getnotzero.com/CHANGELOG.md" | head -3 || true  # head closes the pipe early → curl SIGPIPE; don't let pipefail fail the step (it cascaded to skip anchor in 0.1.30)

      - name: Verify the live feed
        if: env.IS_DRY != 'true'
        shell: bash
        run: |
          feed=$([ "${{ matrix.platform }}" = mac ] && echo latest-mac.yml || ([ "${{ matrix.platform }}" = win ] && echo latest.yml || echo latest-linux.yml))
          echo "published feed:"; curl -s "https://dl.getnotzero.com/$feed" | head -3 || true  # same SIGPIPE/pipefail guard

  # Anchor this release's download hashes in the Bitcoin blockchain (OpenTimestamps). After all three platforms
  # publish, hash the exact files the website serves, write one SHA256SUMS, and timestamp it — so anyone (and,
  # later, the app itself via the local node) can prove a download matches a hash committed on-chain.
  #
  # The .ots proof is PENDING at first (a calendar attestation); it upgrades to a Bitcoin-block attestation once
  # the OTS calendars aggregate + confirm (~a few hours). `ots verify` upgrades pending proofs automatically; a
  # follow-up job (or the verify page / node check) can `ots upgrade` + republish once it's block-anchored.
  #
  # Runs only on a REAL release, and only if all three platform builds succeeded (needs: release).
  anchor:
    needs: release
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: "r2:notzero-dl"
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACL: private
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install OpenTimestamps client + rclone
        run: |
          python -m pip install --upgrade pip opentimestamps-client
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Build SHA256SUMS from the published downloads and timestamp it on Bitcoin
        shell: bash
        run: |
          set -euo pipefail
          VER="$(python -c "import json;print(json.load(open('desktop/package.json'))['version'])")"
          # the exact stable files the website's download buttons serve (overwritten each release)
          FILES="notzero-mac.dmg notzero-win.exe notzero-linux.AppImage"
          # also cover the mac AUTO-UPDATE artifact — the updater downloads the .zip (different bytes than the .dmg),
          # so include it too or in-app node verification can't confirm a mac update. (win/linux updaters reuse the
          # same file as the website download, already covered.) Its name is in the mac feed's `path:`.
          MACZIP="$(rclone cat "$R2_BUCKET/latest-mac.yml" 2>/dev/null | sed -n 's/^path: *//p' | tr -d '\r' | head -1)"
          [ -n "$MACZIP" ] && FILES="$FILES $MACZIP"
          mkdir -p anchor && cd anchor
          # pull straight from R2 (source of truth — no CDN cache lag), then hash
          for f in $FILES; do echo "-> $f"; rclone copyto "$R2_BUCKET/$f" "$f" --s3-no-check-bucket; done
          sha256sum $FILES > SHA256SUMS
          echo "----- SHA256SUMS (notzero $VER) -----"; cat SHA256SUMS
          # timestamp the checksum file on the Bitcoin blockchain (submits to the public OTS calendars)
          ots stamp SHA256SUMS
          ots info SHA256SUMS.ots | sed -n '1,4p'
          # publish: stable pair (current release, no-cache) + immutable versioned pair (permanent per-release record)
          rclone copyto SHA256SUMS     "$R2_BUCKET/SHA256SUMS"           --s3-no-check-bucket --header-upload "Cache-Control: no-cache"
          rclone copyto SHA256SUMS.ots "$R2_BUCKET/SHA256SUMS.ots"       --s3-no-check-bucket --header-upload "Cache-Control: no-cache"
          rclone copyto SHA256SUMS     "$R2_BUCKET/SHA256SUMS-$VER"      --s3-no-check-bucket
          rclone copyto SHA256SUMS.ots "$R2_BUCKET/SHA256SUMS-$VER.ots"  --s3-no-check-bucket
          echo "anchored notzero $VER on Bitcoin (proof pending calendar → block attestation)"
