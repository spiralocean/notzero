# Upgrade the OpenTimestamps proofs published by the release `anchor` job.
#
# `anchor` publishes each release's SHA256SUMS.ots as a PENDING proof (a commitment held by the OTS calendars).
# A few hours later the calendars batch it into a Bitcoin transaction and it confirms in a block. This job runs
# on a schedule, finds any pending proof, `ots upgrade`s it to a full Bitcoin-block attestation, and republishes
# the ones that reached a block — so the on-chain proof becomes self-contained (verifiable against a node with
# no calendar round-trip). Once every proof is anchored, this is a cheap no-op.
#
# It is also what makes a release LIVE. The Release workflow only STAGES one (staged/<version>/ in the bucket);
# the moment that version's proof reaches a block here, scripts/promote-release.sh publishes its feeds, download
# files, SHA256SUMS and changelog — so an update reaches users already confirmed on-chain, and the app's
# "waiting for Bitcoin" hold (desktop/update-hold.js) stays out of sight. Hourly, because this cadence is now the
# gap between "Bitcoin confirmed it" and "users get it".
#
# HOTFIX: Run workflow → promote_now = the version. It goes live at once with its proof still pending; installs
# hold it, say so, and offer "install now".
#
# Needs the same R2 secrets as the Release workflow (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT).

name: Upgrade timestamps · promote releases

on:
  schedule:
    - cron: "17 * * * *" # hourly (offset off the hour so it isn't in the scheduler's rush)
  workflow_dispatch:
    inputs:
      promote_now:
        description: "HOTFIX — a staged version (e.g. 0.1.95) to make live NOW, before its Bitcoin timestamp confirms. Leave empty for a normal run."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: upgrade-timestamps
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: "r2:notzero-dl"
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACL: private
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install OpenTimestamps client + rclone
        run: |
          python -m pip install --upgrade pip opentimestamps-client
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Upgrade pending proofs; republish the ones that reached a Bitcoin block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p up && cd up
          # every proof the anchor job has published: the stable one + one per release
          # --files-only: lsf lists directories whatever --include says, and the bucket root now has staged/ —
          # which this loop then tried to read as a proof, failing every run while a release was staged
          rclone lsf "$R2_BUCKET" --files-only --include "SHA256SUMS*.ots" > list.txt
          if [ ! -s list.txt ]; then echo "no proofs published yet — nothing to do"; exit 0; fi
          mapfile -t PROOFS < list.txt
          upgraded=0; pending=0; done_already=0
          for p in "${PROOFS[@]}"; do
            [ -n "$p" ] || continue
            rclone copyto "$R2_BUCKET/$p" "$p" --s3-no-check-bucket
            if ots info "$p" | grep -q "BitcoinBlockHeaderAttestation"; then
              echo "· $p — already anchored on-chain"; done_already=$((done_already+1)); rm -f "$p"; continue
            fi
            before="$(sha256sum "$p" | awk '{print $1}')"
            ots upgrade "$p" || true   # exits 1 while still pending — normal, not an error
            after="$(sha256sum "$p" | awk '{print $1}')"
            if [ "$before" != "$after" ]; then
              # got the Bitcoin-block attestation → republish (stable stays no-cache; versioned copies cacheable)
              if [ "$p" = "SHA256SUMS.ots" ]; then
                rclone copyto "$p" "$R2_BUCKET/$p" --s3-no-check-bucket --header-upload "Cache-Control: no-cache"
              else
                rclone copyto "$p" "$R2_BUCKET/$p" --s3-no-check-bucket
              fi
              echo "✓ $p — upgraded to a Bitcoin-block attestation and republished"; upgraded=$((upgraded+1))
            else
              echo "· $p — still pending calendar → block confirmation"; pending=$((pending+1))
            fi
            rm -f "$p" "$p.bak"
          done
          echo "done — anchored this run: $upgraded · still pending: $pending · already anchored: $done_already"
      # Staged releases, oldest first: promote each whose proof now carries a Bitcoin attestation. One still
      # pending stops the walk — a newer release must not go out over an older one that is still waiting. A
      # promote_now hotfix jumps that queue, and whatever it overtook is then SUPERSEDED: dropped from the stage
      # rather than promoted later (promote-release.sh refuses to move the feeds backwards in any case).
      - name: Promote staged releases whose timestamp has confirmed
        shell: bash
        env:
          PROMOTE_NOW: ${{ inputs.promote_now }}
        run: |
          set -euo pipefail
          PROMOTE_NOW="${PROMOTE_NOW#v}"
          staged() { rclone lsf "$R2_BUCKET/staged" --dirs-only 2>/dev/null | tr -d '/' | sort -V || true; }
          if [ -n "$PROMOTE_NOW" ]; then
            staged | grep -qxF "$PROMOTE_NOW" || { echo "::error::promote_now=$PROMOTE_NOW is not staged (staged: $(staged | tr '\n' ' '))"; exit 1; }
            echo "→ $PROMOTE_NOW — HOTFIX: promoting now, proof still pending"
            bash scripts/promote-release.sh "$PROMOTE_NOW"
          fi
          live="$(rclone cat "$R2_BUCKET/latest-linux.yml" 2>/dev/null | sed -n 's/^version: *//p' | tr -d '\r' | head -1 || true)"
          for v in $(staged); do
            if [ -n "$live" ] && [ "$(printf '%s\n%s\n' "$v" "$live" | sort -V | tail -1)" = "$live" ]; then
              echo "· $v — superseded by live $live: dropping it from the stage"; rclone purge "$R2_BUCKET/staged/$v" -q; continue
            fi
            if ! rclone cat "$R2_BUCKET/SHA256SUMS-$v.ots" > proof.ots 2>/dev/null || [ ! -s proof.ots ]; then
              # never anchored: a release run that failed part-way (anchor needs all three platforms), or one
              # still in progress. It must not block the queue — a fixed re-release carries a higher version.
              echo "· $v — staged but never anchored (release failed or still running): skipping"; continue
            fi
            if ots info proof.ots | grep -q "BitcoinBlockHeaderAttestation"; then
              echo "→ $v — confirmed in a Bitcoin block: promoting"
              bash scripts/promote-release.sh "$v"; live="$v"
            else
              echo "· $v — staged, timestamp still pending"; break
            fi
          done
